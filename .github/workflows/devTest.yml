name: Deploy Application

on:
  push:
    branches-ignore: [ main ]

env:
  FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  TEST_USER1_PASSWORD: ${{ secrets.TEST_USER1 }}
  TEST_USER2_PASSWORD: ${{ secrets.TEST_USER2 }}
  TEST_USER3_PASSWORD: ${{ secrets.TEST_USER3 }}
  TEST_USER4_PASSWORD: ${{ secrets.TEST_USER4 }}
  TEST_USER5_PASSWORD: ${{ secrets.TEST_USER5 }}
  TEST_USER6_PASSWORD: ${{ secrets.TEST_USER6 }}
  TEST_USER7_PASSWORD: ${{ secrets.TEST_USER7 }}
  TEST_USER8_PASSWORD: ${{ secrets.TEST_USER8 }}
  TEST_USER9_PASSWORD: ${{ secrets.TEST_USER9 }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest Backend/tests/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}

    - name: Build and push
      run: |
        docker build -t maximusb2023/sed-flask-app:latest .
        docker push maximusb2023/sed-flask-app:latest